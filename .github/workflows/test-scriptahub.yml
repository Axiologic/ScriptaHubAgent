name: ScriptaHub regression gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exercise service boundaries and concurrent job recovery
        run: node tools/test-release.mjs --repeat 2 --output "${{ runner.temp }}/scriptahub-tests"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scriptahub-test-results
          path: ${{ runner.temp }}/scriptahub-tests
          if-no-files-found: error
