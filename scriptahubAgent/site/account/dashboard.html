<!doctype html>
<html lang="en">
<head>
  <script data-site-theme-bootstrap>try{const t=localStorage.getItem("scripta-site-theme");document.documentElement.dataset.theme=["light","orange","nord","dark","dark-orange"].includes(t)?t:"light"}catch{document.documentElement.dataset.theme="light"}try{const s=Number(localStorage.getItem("scripta-site-scale-v2")||1);document.documentElement.style.setProperty("--site-scale",String(Number.isFinite(s)?Math.max(.8,Math.min(1.5,s)):1));document.documentElement.dataset.largeText=String(Number.isFinite(s)&&s>=1.25)}catch{}</script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>Dashboard · ScriptaHub</title>
  <link rel="stylesheet" href="../assets/site.css"><link rel="stylesheet" href="../assets/dashboard.css">
</head>
<body data-app-page="true">
  <main class="site-shell dashboard-page">
    <header class="site-header">
      <a class="wordmark" href="../index.html">ScriptaHub<span>.com</span></a>
      <div class="header-tools"><a class="header-home" data-account-link href="./index.html">My account</a><a class="header-create" data-create-link href="../create/index.html">Create</a></div>
    </header>
    <header class="dashboard-heading dashboard-title">
      <h1 data-dashboard-text="Dashboard">Dashboard</h1>
      <button id="refresh" class="site-icon-button" type="button" data-dashboard-label="Refresh dashboard" aria-label="Refresh dashboard" title="Refresh dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg></button>
    </header>
    <nav class="dashboard-tabs" role="tablist" data-dashboard-label="Dashboard sections" aria-label="Dashboard sections">
      <button id="dashboard-books-tab" type="button" role="tab" data-view="books" data-dashboard-text="My books" aria-selected="true" aria-controls="dashboard-content">My books</button>
      <button id="dashboard-changes-tab" type="button" role="tab" data-view="changes" data-dashboard-text="Change requests" aria-selected="false" aria-controls="dashboard-content" tabindex="-1">Change requests</button>
      <button id="dashboard-tasks-tab" type="button" role="tab" data-view="tasks" data-dashboard-text="Tasks" aria-selected="false" aria-controls="dashboard-content" tabindex="-1" hidden>Tasks</button>
    </nav>
    <section id="dashboard-content" role="tabpanel" aria-labelledby="dashboard-books-tab" tabindex="0" aria-busy="true"><p class="dashboard-empty" data-dashboard-text="Loading dashboard…">Loading dashboard…</p></section>
  </main>
  <script src="../collection.js"></script><script src="../assets/site.js"></script>
  <script type="module" src="../assets/dashboard.js"></script>
</body>
</html>
