<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScriptaHub Film · Cinema</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#eef1f1;color:#203544;font:14px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:24px auto;padding:0 12px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:14px}h1{font:500 28px Georgia,serif;margin:0}.eyebrow{font-size:10px;letter-spacing:.2em;color:#70878d;margin-bottom:5px}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0}nav button,label.upload{padding:9px 12px;border-radius:8px;border:1px solid #cdd8da;color:#375668;background:#fff;cursor:pointer;font:inherit}nav button.active{background:#1c3948;color:#fff}#description{font-size:13px;max-width:880px;color:#56717c}.upload{display:inline-block;margin-top:14px}footer{font-size:11px;color:#72868e;padding:14px 0 32px}#file{display:none}.themebuttons{display:flex;gap:7px}.themebuttons button{width:26px;height:26px;border:2px solid white;border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px #94a4aa}.themebuttons button[data-theme=color]{background:conic-gradient(#e7b846,#ee876d,#559bad,#e7b846)}.themebuttons button[data-theme=paper]{background:#fff}.themebuttons button[data-theme=night]{background:#0c1824}.download{color:#426c7b;text-decoration:none}@media(max-width:540px){main{margin:16px auto;padding:0 10px}h1{font-size:23px}header{margin-bottom:12px}nav{margin:14px 0;gap:6px}nav button,label.upload{font-size:12px;padding:7px 10px}#description{font-size:12px}}
</style></head><body><main><header><div><div class="eyebrow">SHF · SCRIPTAHUB FILM</div><h1>An idea worth understanding.</h1></div></header><shf-player id="player"></shf-player><nav id="films"></nav><p id="description"></p><footer>Explore the scenes, read the transcript, or watch in fullscreen. Narration and captions follow the same timeline.<br><label class="upload" for="file">Open an SHF file</label> <input id="file" type="file" accept=".shf,.json"> <a id="save" href="#" class="download">Download SHF</a><p id="error" role="alert"></p></footer></main><script>__RUNTIME__</script><script>
const films=__FILMS__;if(films.length===1){document.querySelector("header").hidden=true;document.querySelector("footer").hidden=true;document.getElementById("films").hidden=true;document.getElementById("description").hidden=true;document.title=films[0].title+" · SHF";}const player=document.getElementById('player');window.demoFilms=films;
async function choose(i){await player.setFilm(films[i]);document.querySelectorAll('[data-film]').forEach(b=>b.classList.toggle('active',+b.dataset.film===i));document.getElementById('description').textContent=(films[i].description||films[i].editorial?.disclosure||'An original visual presentation.')+' '+(films[i].audioDisclosure||'');}
films.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.title;b.dataset.film=i;b.onclick=()=>choose(i);document.getElementById('films').append(b);});
document.getElementById('file').onchange=async e=>{try{await player.loadFile(e.target.files[0]);document.getElementById('error').textContent='';}catch(err){document.getElementById('error').textContent=err.message;}};
document.getElementById('save').onclick=e=>{e.preventDefault();const blob=new Blob([SHF.core.packFilm(player.film)],{type:'application/zip'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=player.film.id+'.shf';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);};if(films.length)choose(0);
</script></body></html>
